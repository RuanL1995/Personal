<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI3 Synthetic Vacation Planner</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #172033; }
    form { display: grid; gap: .75rem; max-width: 30rem; } input, button { font: inherit; padding: .6rem; }
    button { cursor: pointer; } pre { background: #f2f4f8; padding: 1rem; overflow: auto; }
    .muted { color: #596579; }
  </style>
</head>
<body>
  <h1>AI3 Synthetic Vacation Planner</h1>
  <p class="muted">Local browser-hosted mock for Power Automate and PAD testing. No real flights or bookings are used.</p>
  <form id="search">
    <label>Origin <input name="origin" value="JFK" required></label>
    <label>Destination <input name="destination" value="LHR" required></label>
    <label>Departure <input name="departureDate" type="date" value="2030-06-01" required></label>
    <label>Travelers <input name="travelers" type="number" min="1" value="1" required></label>
    <button>Search synthetic flights</button>
  </form>
  <p id="status" class="muted"></p>
  <pre id="results">Search results will appear here.</pre>
  <script>
    const form = document.querySelector("#search");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      status.textContent = "Searching...";
      const data = Object.fromEntries(new FormData(form));
      data.travelers = Number(data.travelers);
      const response = await fetch("/api/search", {
        method: "POST", headers: { "Content-Type": "application/json", "Idempotency-Key": crypto.randomUUID() },
        body: JSON.stringify(data)
      });
      const payload = await response.json();
      results.textContent = JSON.stringify(payload, null, 2);
      status.textContent = response.ok ? "Search complete. Use a flightId from the JSON to book through Power Automate or the API." : "Search failed.";
    });
  </script>
</body>
</html>
