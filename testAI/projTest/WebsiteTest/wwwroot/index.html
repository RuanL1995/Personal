<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanderwise Vacation Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .hero { background: linear-gradient(135deg, #19376d, #406882); color: white; }
    .plan-card { border: 0; box-shadow: 0 0.5rem 1.5rem rgba(25,55,109,.1); }
  </style>
</head>
<body>
  <header class="hero py-5 mb-4">
    <div class="container">
      <span class="badge text-bg-warning mb-3">Local demo</span>
      <h1 class="display-5 fw-bold">Your next adventure</h1>
      <p class="lead mb-0">Plans created by Semantic Kernel and local mock travel APIs appear here.</p>
    </div>
  </header>
  <main class="container pb-5">
    <div id="empty" class="alert alert-info">Start <code>semanticTest</code> and submit a vacation prompt to publish a plan.</div>
    <div id="plans" class="row g-4"></div>
  </main>
  <script>
    const money = value => new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(value);
    async function loadPlans() {
      const response = await fetch("/api/plans");
      const plans = await response.json();
      document.querySelector("#empty").hidden = plans.length > 0;
      document.querySelector("#plans").innerHTML = plans.map(plan => `
        <div class="col-lg-8">
          <article class="card plan-card">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-start gap-3">
                <div><span class="badge text-bg-primary mb-2">${plan.origin} → ${plan.destination}</span>
                <h2 class="h4">${plan.travelerName}'s vacation</h2></div>
                <span class="badge text-bg-success">${money(plan.budget)} budget</span>
              </div>
              <p class="text-secondary">${plan.summary}</p>
              <div class="row g-3 mb-3">
                <div class="col-md-6"><div class="bg-light rounded p-3"><strong>✈ Flight</strong><br>
                  ${plan.flight?.airline ?? "TBD"} · ${money(plan.flight?.price ?? 0)}<br><small>${plan.flight?.stops ?? ""}</small></div></div>
                <div class="col-md-6"><div class="bg-light rounded p-3"><strong>🏨 Hotel</strong><br>
                  ${plan.hotel?.name ?? "TBD"} · ${money(plan.hotel?.nightlyRate ?? 0)}/night<br><small>${plan.hotel?.description ?? ""}</small></div></div>
              </div>
              <p class="mb-1"><strong>Dates:</strong> ${plan.departureDate} to ${plan.returnDate}</p>
              <p class="mb-0"><strong>Recommendation:</strong> ${plan.recommendation}</p>
              <hr><h3 class="h6">Suggested activities</h3>
              <ul class="mb-0">${(plan.activities ?? []).map(activity => `<li>${activity}</li>`).join("")}</ul>
            </div>
          </article>
        </div>`).join("");
    }
    loadPlans();
    setInterval(loadPlans, 5000);
  </script>
</body>
</html>
